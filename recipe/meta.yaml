{% set name = "snowpark-connect" %}
{% set version = "1.30" %}
{% set python_min = "3.10" %}
{% set python_max = "3.13" %}

package:
  name: {{ name|lower }}
  version: "{{ version }}"

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/snowpark_connect-{{ version }}.tar.gz
  sha256: 7bf5c92524a5c139d01dc85d61e8f1fc5215c98171cce486697d5403fda0a394

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }},<{{ python_max }}
    - snowpark-connect-deps-1 ==3.56.5
    - snowpark-connect-deps-2 ==3.56.5
    - certifi >=2025.1.31
    - cloudpickle
    - fsspec
    - jpype1 !=1.7.0,!=1.7.1
    - protobuf >=4.25.3,<6.34
    - s3fs >=2025.3.0
    - snowflake.core >=1.0.5,<2
    - snowflake-snowpark-python >=1.52.0,<1.53.0
    - snowflake-connector-python >=3.18.0
    - sqlglot >=26.3.8
    - aiobotocore >=2.23.0,<4
    - py4j >=0.10.9.7,<0.10.10.0
    - pandas >=1.0.5
    - pyarrow >=23.0.1,<25.0.0
    - grpcio >=1.56.0,<=1.78.0
    - grpcio-status >=1.56.0,<=1.78.0
    - googleapis-common-protos >=1.56.4
    - numpy >=1.15
    - gcsfs >=2025.2.0
  run_constrained:
    - jdk4py ==17.0.9.2

test:
  imports:
    - snowflake.snowpark_connect
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://www.snowflake.com
  summary: Snowpark Connect for Spark
  license: Apache-2.0
  license_file:
    - LICENSE-binary
    - NOTICE-binary
    - LICENSE.txt

extra:
  recipe-maintainers:
    - sfc-gh-igarish
